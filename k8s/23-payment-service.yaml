apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: microservices
spec:
  replicas: 2
  selector:
    matchLabels: { app: payment-service }
  template:
    metadata:
      labels: { app: payment-service }
    spec:
      containers:
        - name: payment-service
          image: payment-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8084 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, valueFrom: { configMapKeyRef: { name: app-config, key: SPRING_PROFILES_ACTIVE } } }
            - { name: PAYMENT_DB_HOST, value: "payment-db" }
            - { name: PAYMENT_DB_PORT, value: "27017" }
            - { name: PAYMENT_DB_NAME, value: "payment_db" }
            - { name: PAYMENT_DB_USER, valueFrom: { secretKeyRef: { name: app-secrets, key: PAYMENT_DB_USER } } }
            - { name: PAYMENT_DB_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: PAYMENT_DB_PASSWORD } } }
            - { name: KAFKA_BOOTSTRAP_SERVERS, valueFrom: { configMapKeyRef: { name: app-config, key: KAFKA_BOOTSTRAP_SERVERS } } }
            - { name: EXTERNAL_RANDOM_API_URL, valueFrom: { configMapKeyRef: { name: app-config, key: EXTERNAL_RANDOM_API_URL } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: app-secrets, key: JWT_SECRET } } }
          resources:
            requests: { cpu: "250m", memory: "384Mi" }
            limits: { cpu: "1", memory: "768Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8084 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8084 }
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: microservices
spec:
  selector: { app: payment-service }
  ports: [{ port: 8084, targetPort: 8084 }]
