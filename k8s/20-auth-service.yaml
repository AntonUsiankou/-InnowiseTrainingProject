apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: microservices
spec:
  replicas: 2
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      containers:
        - name: auth-service
          image: auth-service:latest
          imagePullPolicy: IfNotPresent   # built locally via `minikube image build`
          ports: [{ containerPort: 8081 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, valueFrom: { configMapKeyRef: { name: app-config, key: SPRING_PROFILES_ACTIVE } } }
            - { name: AUTH_DB_HOST, value: "auth-db" }
            - { name: AUTH_DB_PORT, value: "5432" }
            - { name: AUTH_DB_NAME, value: "auth_db" }
            - { name: AUTH_DB_USER, valueFrom: { secretKeyRef: { name: app-secrets, key: AUTH_DB_USER } } }
            - { name: AUTH_DB_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: AUTH_DB_PASSWORD } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: app-secrets, key: JWT_SECRET } } }
          resources:
            requests: { cpu: "250m", memory: "384Mi" }
            limits: { cpu: "1", memory: "768Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: microservices
spec:
  selector: { app: auth-service }
  ports: [{ port: 8081, targetPort: 8081 }]
