apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: microservices
spec:
  replicas: 2
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      containers:
        - name: order-service
          image: order-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8083 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, valueFrom: { configMapKeyRef: { name: app-config, key: SPRING_PROFILES_ACTIVE } } }
            - { name: ORDER_DB_HOST, value: "order-db" }
            - { name: ORDER_DB_PORT, value: "5432" }
            - { name: ORDER_DB_NAME, value: "order_db" }
            - { name: ORDER_DB_USER, valueFrom: { secretKeyRef: { name: app-secrets, key: ORDER_DB_USER } } }
            - { name: ORDER_DB_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: ORDER_DB_PASSWORD } } }
            - { name: KAFKA_BOOTSTRAP_SERVERS, valueFrom: { configMapKeyRef: { name: app-config, key: KAFKA_BOOTSTRAP_SERVERS } } }
            - { name: USER_SERVICE_URL, valueFrom: { configMapKeyRef: { name: app-config, key: USER_SERVICE_URL } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: app-secrets, key: JWT_SECRET } } }
          resources:
            requests: { cpu: "250m", memory: "384Mi" }
            limits: { cpu: "1", memory: "768Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8083 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8083 }
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: microservices
spec:
  selector: { app: order-service }
  ports: [{ port: 8083, targetPort: 8083 }]
