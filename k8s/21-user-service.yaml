apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: microservices
spec:
  replicas: 2
  selector:
    matchLabels: { app: user-service }
  template:
    metadata:
      labels: { app: user-service }
    spec:
      containers:
        - name: user-service
          image: user-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8082 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, valueFrom: { configMapKeyRef: { name: app-config, key: SPRING_PROFILES_ACTIVE } } }
            - { name: USER_DB_HOST, value: "user-db" }
            - { name: USER_DB_PORT, value: "5432" }
            - { name: USER_DB_NAME, value: "user_db" }
            - { name: USER_DB_USER, valueFrom: { secretKeyRef: { name: app-secrets, key: USER_DB_USER } } }
            - { name: USER_DB_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: USER_DB_PASSWORD } } }
            - { name: REDIS_HOST, valueFrom: { configMapKeyRef: { name: app-config, key: REDIS_HOST } } }
            - { name: REDIS_PORT, valueFrom: { configMapKeyRef: { name: app-config, key: REDIS_PORT } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: app-secrets, key: JWT_SECRET } } }
          resources:
            requests: { cpu: "250m", memory: "384Mi" }
            limits: { cpu: "1", memory: "768Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8082 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: microservices
spec:
  selector: { app: user-service }
  ports: [{ port: 8082, targetPort: 8082 }]
