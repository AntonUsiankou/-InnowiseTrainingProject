# ---------------- Postgres: auth-db ----------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-db
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth-db }
  template:
    metadata:
      labels: { app: auth-db }
    spec:
      containers:
        - name: auth-db
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: auth_db }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: AUTH_DB_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: AUTH_DB_PASSWORD } }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "auth_user", "-d", "auth_db"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "auth_user", "-d", "auth_db"] }
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          emptyDir: {}   # swap for a PVC in a real cluster
---
apiVersion: v1
kind: Service
metadata:
  name: auth-db
  namespace: microservices
spec:
  selector: { app: auth-db }
  ports: [{ port: 5432, targetPort: 5432 }]
---
