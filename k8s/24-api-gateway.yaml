apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: microservices
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, valueFrom: { configMapKeyRef: { name: app-config, key: SPRING_PROFILES_ACTIVE } } }
            - { name: AUTH_SERVICE_URL, valueFrom: { configMapKeyRef: { name: app-config, key: AUTH_SERVICE_URL } } }
            - { name: USER_SERVICE_URL, valueFrom: { configMapKeyRef: { name: app-config, key: USER_SERVICE_URL } } }
            - { name: ORDER_SERVICE_URL, valueFrom: { configMapKeyRef: { name: app-config, key: ORDER_SERVICE_URL } } }
            - { name: PAYMENT_SERVICE_URL, valueFrom: { configMapKeyRef: { name: app-config, key: PAYMENT_SERVICE_URL } } }
            - { name: REDIS_HOST, valueFrom: { configMapKeyRef: { name: app-config, key: REDIS_HOST } } }
            - { name: REDIS_PORT, valueFrom: { configMapKeyRef: { name: app-config, key: REDIS_PORT } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: app-secrets, key: JWT_SECRET } } }
          resources:
            requests: { cpu: "250m", memory: "384Mi" }
            limits: { cpu: "1", memory: "768Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: microservices
spec:
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
