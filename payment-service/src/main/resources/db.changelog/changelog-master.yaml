databaseChangeLog:
  - changeSet:
      id: 1
      author: ausiankou
      changes:
        - createCollection:
            collectionName: payments
        - createIndex:
            collectionName: payments
            indexName: idx_order_id
            keys:
              order_id: 1
            options:
              unique: true
        - createIndex:
            collectionName: payments
            indexName: idx_user_id
            keys:
              user_id: 1
        - createIndex:
            collectionName: payments
            indexName: idx_status
            keys:
              status: 1
        - createIndex:
            collectionName: payments
            indexName: idx_timestamp
            keys:
              timestamp: 1