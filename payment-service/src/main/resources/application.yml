spring:
  application:
    name: payment-service
  data:
    mongodb:
      uri: mongodb://${PAYMENT_DB_USER:payment_user}:${PAYMENT_DB_PASSWORD:payment_pass}@${PAYMENT_DB_HOST:localhost}:${PAYMENT_DB_PORT:27017}/${PAYMENT_DB_NAME:payment_db}?authSource=admin&replicaSet=rs0
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        # prevents duplicate records on the broker if a retry is triggered
        # after the original send actually succeeded (network blip on the ack)
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

kafka:
  topics:
    create-payment: CREATE_PAYMENT

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-min-32-bytes-please}

services:
  external-random-api:
    base-url: ${EXTERNAL_RANDOM_API_URL:https://www.random.org}

server:
  port: ${SERVER_PORT:8084}
  tomcat:
    threads:
      max: 200
      min-spare: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers,retries
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      externalRandomApi:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 5
  retry:
    instances:
      externalRandomApi:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
