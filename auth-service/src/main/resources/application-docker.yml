spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/auth_db
    username: postgres  # Убедитесь, что здесь postgres, а не 1234
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

server:
  port: ${SERVER_PORT:8083}

user:
  service:
    url: ${USER_SERVICE_URL:http://user-service:8082}

jwt:
  secret: ${JWT_SECRET:zP8vR2wX5mN9qK1sB4jL7hV0dC3fA6yT9uI1oP4kG7sJ2mN5bV8cX0zQ3wE6rT9}
  access:
    expiration: 900000
  refresh:
    expiration: 604800000