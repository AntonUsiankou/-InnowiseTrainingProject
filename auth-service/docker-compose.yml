version: '3.8'
services:
  redis:
    image: redis:7-alpine
    container_name: auth-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - auth-network
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8083
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://host.docker.internal:8082}
      JWT_SECRET: ${JWT_SECRET:-zP8vR2wX5mN9qK1sB4jL7hV0dC3fA6yT9uI1oP4kG7sJ2mN5bV8cX0zQ3wE6rT9}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - auth-network
volumes:
  redis_data:

networks:
  auth-network:
    driver: bridge