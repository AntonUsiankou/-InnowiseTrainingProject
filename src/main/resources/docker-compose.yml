version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_DB: InnowiseTraineeProject
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - innowise-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U innowiseuser -d innowisedb" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  adminer:
    image: adminer
    container_name: adminer_container
    ports:
      - "8081:8080"
    restart: always

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: innowise-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/innowisedb
      DB_USERNAME: innowiseuser
      DB_PASSWORD: innowisepassword
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - innowise-network

volumes:
  postgres_data:
  redis_data:

networks:
  innowise-network:
    driver: bridge