# docker-compose-full.yml
version: '3.8'

networks:
  microservices-network:
    driver: bridge

services:
  # ========== USER SERVICE ==========
  user-db:
    image: postgres:15
    container_name: user-db
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
    ports:
      - "5438:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - microservices-network

  user-service:
    image: user-service:latest  # Используем ваш существующий образ
    container_name: user-service
    environment:
      DB_URL: jdbc:postgresql://user-db:5432/userdb
      DB_USERNAME: user
      DB_PASSWORD: user
      PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      - user-db
    networks:
      - microservices-network
    restart: unless-stopped

  # ========== AUTH SERVICE ==========
  auth-db:
    image: postgres:15-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    ports:
      - "5439:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - microservices-network

  auth-redis:
    image: redis:7-alpine
    container_name: auth-redis
    ports:
      - "6380:6379"
    networks:
      - microservices-network

  auth-service:
    image: auth-service:latest  # Используем ваш существующий образ
    container_name: auth-service
    environment:
      DB_URL: jdbc:postgresql://auth-db:5432/authdb
      DB_USERNAME: auth
      DB_PASSWORD: auth
      REDIS_HOST: auth-redis
      PORT: 8083
    ports:
      - "8083:8083"
    depends_on:
      - auth-db
      - auth-redis
    networks:
      - microservices-network
    restart: unless-stopped

  # ========== ORDER SERVICE ==========
  order-db:
    image: postgres:15-alpine
    container_name: order-db
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
    ports:
      - "5440:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d orderdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-service:
    build: .
    container_name: order-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://order-db:5432/orderdb
      DB_USERNAME: order
      DB_PASSWORD: order
      SERVER_PORT: 8084
      USER_SERVICE_URL: http://user-service:8082
      AUTH_SERVICE_URL: http://auth-service:8083
    ports:
      - "8084:8084"
    depends_on:
      order-db:
        condition: service_healthy
      user-service:
        condition: service_started
      auth-service:
        condition: service_started
    networks:
      - microservices-network
    restart: unless-stopped

volumes:
  user-db-data:
  auth-db-data:
  order-db-data: